name: Lab 01 filesystem experiment

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lab01-${{ github.ref }}
  cancel-in-progress: false

jobs:
  experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      KIND_VERSION: v0.33.0
      KUBECTL_VERSION: v1.37.0
      NODE_IMAGE: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
      LAB: 03-kubernetes-security/01-readonly-rootfs-writable-volume
    steps:
      - name: Check out the experiment
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install checksum-verified tools on the temporary runner
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          mkdir -p lab01-bin
          curl --fail --silent --show-error --location --retry 3 -O "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          curl --fail --silent --show-error --location --retry 3 -O "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64.sha256sum"
          sha256sum --check kind-linux-amd64.sha256sum
          install -m 0755 kind-linux-amd64 lab01-bin/kind
          curl --fail --silent --show-error --location --retry 3 -o kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          curl --fail --silent --show-error --location --retry 3 -o kubectl.sha256 "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl.sha256"
          printf '%s  kubectl\n' "$(cat kubectl.sha256)" | sha256sum --check
          install -m 0755 kubectl lab01-bin/kubectl
          echo "${RUNNER_TEMP}/lab01-bin" >> "$GITHUB_PATH"
          echo "KUBECONFIG=${RUNNER_TEMP}/lab01-kubeconfig" >> "$GITHUB_ENV"
      - name: Record environment
        run: |
          date -u '+%Y-%m-%dT%H:%M:%SZ'
          uname -sm
          kind version
          kubectl version --client
          docker version --format 'Docker server: {{.Server.Version}}'
          printf 'Source commit: %s\nNode image: %s\n' "$GITHUB_SHA" "$NODE_IMAGE"
      - name: Create baseline cluster
        run: kind create cluster --name security-labs --config "$LAB/kind.yaml" --image "$NODE_IMAGE" --wait 180s
      - name: Run baseline experiment
        run: bash "$LAB/verify.sh" baseline
      - name: Remove baseline cluster
        run: kind delete cluster --name security-labs
      - name: Set up Go for the lab-only runtime build
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.6'
          cache: false
      - name: Build and test the lab-only runtime compatibility patch
        run: |
          set -euo pipefail
          source_dir="${RUNNER_TEMP}/lab01-containerd"
          git init "$source_dir"
          git -C "$source_dir" remote add origin https://github.com/containerd/containerd.git
          git -C "$source_dir" fetch --depth=1 origin a7fe631d96c08fb14cf8eff0afdc280e99c30a94
          git -C "$source_dir" checkout --detach FETCH_HEAD
          git -C "$source_dir" apply --check "$GITHUB_WORKSPACE/$LAB/runtime/containerd-mount-options.patch"
          git -C "$source_dir" apply "$GITHUB_WORKSPACE/$LAB/runtime/containerd-mount-options.patch"
          cd "$source_dir"
          gofmt -w internal/cri/opts/lab01_mount_linux*.go
          CGO_ENABLED=0 go test -mod=vendor ./internal/cri/opts -run 'TestLab01BindMountOptions|TestWithMounts' -count=1 -v
          CGO_ENABLED=0 go build -mod=vendor -tags 'urfave_cli_no_docs osusergo netgo' -ldflags '-X github.com/containerd/containerd/v2/version.Version=v2.4.0-lab01 -X github.com/containerd/containerd/v2/version.Revision=a7fe631d96c08fb14cf8eff0afdc280e99c30a94-lab01' -o containerd ./cmd/containerd
          ./containerd --version
          sha256sum containerd "$GITHUB_WORKSPACE/$LAB/runtime/containerd-mount-options.patch"
          printf 'ARG BASE\nFROM ${BASE}\nCOPY containerd /usr/local/bin/containerd\n' > Dockerfile.lab01
          docker build --build-arg "BASE=$NODE_IMAGE" -f Dockerfile.lab01 -t lab01-node:containerd-mount-options .
      - name: Create mount-controls cluster
        run: kind create cluster --name security-labs-mounts --config "$LAB/kind-mount-controls.yaml" --image lab01-node:containerd-mount-options --wait 180s
      - name: Record runtime compatibility
        run: |
          docker exec security-labs-mounts-control-plane containerd --version
          docker exec security-labs-mounts-control-plane crictl info | jq '{runtimeFeatures: .runtimeFeatures}'
          kubectl --context kind-security-labs-mounts get nodes -o 'jsonpath={range .items[*]}{.metadata.name}{" "}{.status.declaredFeatures}{"\n"}{end}'
      - name: Run controlled comparison
        run: bash "$LAB/verify.sh" comparison
      - name: Remove temporary lab clusters
        if: always()
        run: |
          kind delete cluster --name security-labs
          kind delete cluster --name security-labs-mounts

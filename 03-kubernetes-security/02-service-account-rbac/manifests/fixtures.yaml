apiVersion: v1
kind: Namespace
metadata:
  name: rbac-lab
---
apiVersion: v1
kind: Namespace
metadata:
  name: rbac-lab-other
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: config-reader
  namespace: rbac-lab
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: rbac-lab
data:
  mode: synthetic-lab
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: other-config
  namespace: rbac-lab
data:
  mode: unrelated-synthetic-config
---
# Empty synthetic object: no credential or secret value is stored here.
apiVersion: v1
kind: Secret
metadata:
  name: synthetic-empty
  namespace: rbac-lab
type: Opaque
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: foreign-config
  namespace: rbac-lab-other
data:
  mode: other-namespace

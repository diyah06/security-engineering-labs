apiVersion: v1
kind: Pod
metadata:
  name: rbac-client
  namespace: rbac-lab
spec:
  serviceAccountName: config-reader
  # This workload intentionally calls the API; its token never enters logs.
  automountServiceAccountToken: true
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: client
      image: python:3.13-alpine
      command: ["sleep", "3600"]
      securityContext:
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 250m
          memory: 128Mi
      volumeMounts:
        - name: probes
          mountPath: /probes
          readOnly: true
  volumes:
    - name: probes
      configMap:
        name: rbac-probes

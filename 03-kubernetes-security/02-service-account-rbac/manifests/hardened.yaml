apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: workload-access
  namespace: rbac-lab
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["app-config"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: workload-access
  namespace: rbac-lab
subjects:
  - kind: ServiceAccount
    name: config-reader
    namespace: rbac-lab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: workload-access
